version: "3.9"

# ============================================
# 一键启动 PostgreSQL + pgvector + Redis
# 适合本地开发，生产用云数据库
# ============================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-rag-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting-rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ollama - 本地Embedding模型（免费）
  # 首次启动后执行: docker exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    container_name: meeting-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]

volumes:
  pgdata:
  ollamadata:
